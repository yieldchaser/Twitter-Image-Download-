name: Download X Images

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: write

jobs:
  download:
    # Do not re-trigger the downloader from its own archive commit.
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gallery-dl
        run: python -m pip install --upgrade gallery-dl

      - name: Prepare X cookies
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: |
          if [ -z "$X_COOKIES" ]; then
            echo "X_COOKIES GitHub secret is not configured"
            exit 1
          fi
          mkdir -p .runtime
          printf '%s' "$X_COOKIES" > .runtime/cookies.json
          python downloader/convert_cookie_editor.py .runtime/cookies.json .runtime/x-cookies.txt
          chmod 600 .runtime/x-cookies.txt
          rm -f .runtime/cookies.json

      - name: Select accounts
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.event.head_commit.message }}" == "Test casharmax X media collector"* ]]; then
            echo "ACCOUNT_FILTER=casharmax" >> "$GITHUB_ENV"
            echo "Targeted test run: casharmax only"
          else
            echo "ACCOUNT_FILTER=" >> "$GITHUB_ENV"
            echo "Normal run: all configured accounts"
          fi

      - name: Download images
        run: python downloader/download_images.py

      - name: Remove runtime credentials
        if: always()
        run: rm -rf .runtime

      - name: Commit downloaded media and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images metadata archive
          if git diff --cached --quiet; then
            echo "No new media or metadata."
            exit 0
          fi
          git commit -m "Update X media archive"
          git push
