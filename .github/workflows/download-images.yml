name: Download X Images

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Account to collect"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - HBGrimes
          - casharmax
          - MarhelmData
          - ole_sanne
  push:
    branches: [main]
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: write

jobs:
  download:
    # Do not re-trigger the downloader from its own archive commit.
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gallery-dl
        run: python -m pip install --upgrade gallery-dl

      - name: Prepare X cookies
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: |
          if [ -z "$X_COOKIES" ]; then
            echo "X_COOKIES GitHub secret is not configured"
            exit 1
          fi
          mkdir -p .runtime
          printf '%s' "$X_COOKIES" > .runtime/cookies.json
          python downloader/convert_cookie_editor.py .runtime/cookies.json .runtime/x-cookies.txt
          chmod 600 .runtime/x-cookies.txt
          rm -f .runtime/cookies.json

      - name: Select accounts
        env:
          DISPATCH_ACCOUNT: ${{ inputs.account }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$DISPATCH_ACCOUNT" != "all" ]]; then
            echo "ACCOUNT_FILTER=$DISPATCH_ACCOUNT" >> "$GITHUB_ENV"
            echo "Manual run: $DISPATCH_ACCOUNT only"
          else
            echo "ACCOUNT_FILTER=" >> "$GITHUB_ENV"
            echo "Run: all configured accounts"
          fi

      - name: Download images
        run: python downloader/download_images.py

      - name: Commit downloaded media and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images metadata archive
          if git diff --cached --quiet; then
            echo "No new media or metadata."
            exit 0
          fi
          git commit -m "Update X media archive"
          git push

      - name: Validate account results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("metadata/download_status.json")
          status = json.loads(path.read_text(encoding="utf-8"))
          print(json.dumps(status, indent=2))
          if not status.get("overall_success"):
              failed = [a["username"] for a in status.get("accounts", []) if a.get("status") != "ok"]
              raise SystemExit(f"Required account collection failed: {', '.join(failed)}")
          PY

      - name: Remove runtime credentials
        if: always()
        run: rm -rf .runtime
